<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cycle — minimal: three panes side by side, the middle one selected. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF" />
      <stop offset="1" stop-color="#1F4FD8" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A8A" flood-opacity="0.35" />
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  </g>
  <rect x="216" y="392" width="148" height="240" rx="40" fill="#FFFFFF" fill-opacity="0.32" />
  <rect x="660" y="392" width="148" height="240" rx="40" fill="#FFFFFF" fill-opacity="0.32" />
  <rect x="404" y="332" width="216" height="360" rx="52" fill="#FFFFFF" filter="url(#lift)" />
</svg>
