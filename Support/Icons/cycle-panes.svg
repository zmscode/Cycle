<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cycle — "Panes": three glass windows side by side; the middle one is the selected window. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="0.55" stop-color="#2B5FE8"/>
      <stop offset="1" stop-color="#1B2FA8"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#E4ECFF" stop-opacity="0.93"/>
    </linearGradient>
    <linearGradient id="content" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC4FF"/>
      <stop offset="1" stop-color="#3A6BFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A1460" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGlow)"/>

    <!-- left pane -->
    <g filter="url(#shadow)">
      <rect x="172" y="372" width="200" height="280" rx="40" fill="url(#glass)" stroke="url(#rim)" stroke-width="4"/>
      <circle cx="206" cy="404" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <circle cx="232" cy="404" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <circle cx="258" cy="404" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <rect x="192" y="430" width="160" height="200" rx="22" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- right pane -->
    <g filter="url(#shadow)">
      <rect x="652" y="372" width="200" height="280" rx="40" fill="url(#glass)" stroke="url(#rim)" stroke-width="4"/>
      <circle cx="686" cy="404" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <circle cx="712" cy="404" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <circle cx="738" cy="404" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <rect x="672" y="430" width="160" height="200" rx="22" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- middle, selected pane -->
    <g filter="url(#shadow)">
      <rect x="396" y="332" width="232" height="360" rx="46" fill="url(#front)"/>
      <circle cx="436" cy="372" r="12" fill="#FF5F57"/>
      <circle cx="470" cy="372" r="12" fill="#FEBC2E"/>
      <circle cx="504" cy="372" r="12" fill="#28C840"/>
      <rect x="418" y="404" width="188" height="264" rx="26" fill="url(#content)"/>
      <rect x="440" y="430" width="100" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.8"/>
      <rect x="440" y="464" width="140" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="440" y="488" width="116" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="396" y="332" width="232" height="360" rx="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="5"/>
    </g>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
</svg>
