<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cycle — "Carousel": the switcher itself; a glass tray of three cards, the centre one lifted and ringed in blue. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F4B" />
      <stop offset="1" stop-color="#121419" />
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#3D7BFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#3D7BFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07" />
    </linearGradient>
    <linearGradient id="trayRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="cardL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08A5D" />
      <stop offset="1" stop-color="#B8443A" />
    </linearGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FC7B4" />
      <stop offset="1" stop-color="#1E7F86" />
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA8FF" />
      <stop offset="1" stop-color="#2F5FE0" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#3A86FF" flood-opacity="0.8" />
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185" /></clipPath>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#aura)" />

    <!-- glass tray -->
    <rect x="150" y="380" width="724" height="300" rx="72" fill="url(#tray)" stroke="url(#trayRim)" stroke-width="4" />

    <!-- side cards -->
    <g filter="url(#soft)">
      <rect x="180" y="420" width="190" height="220" rx="40" fill="url(#cardL)" />
      <rect x="180" y="420" width="190" height="220" rx="40" fill="url(#sheen)" />
      <rect x="654" y="420" width="190" height="220" rx="40" fill="url(#cardR)" />
      <rect x="654" y="420" width="190" height="220" rx="40" fill="url(#sheen)" />
    </g>
    <g fill-opacity="0.9">
      <circle cx="210" cy="450" r="9" fill="#FF5F57" /><circle cx="236" cy="450" r="9" fill="#FEBC2E" /><circle cx="262" cy="450" r="9" fill="#28C840" />
      <circle cx="684" cy="450" r="9" fill="#FF5F57" /><circle cx="710" cy="450" r="9" fill="#FEBC2E" /><circle cx="736" cy="450" r="9" fill="#28C840" />
    </g>
    <rect x="200" y="476" width="150" height="144" rx="20" fill="#FFFFFF" fill-opacity="0.22" />
    <rect x="674" y="476" width="150" height="144" rx="20" fill="#FFFFFF" fill-opacity="0.22" />

    <!-- selected centre card -->
    <g filter="url(#glow)">
      <rect x="372" y="360" width="280" height="340" rx="56" fill="url(#cardC)" />
    </g>
    <rect x="372" y="360" width="280" height="340" rx="56" fill="url(#sheen)" />
    <circle cx="414" cy="404" r="13" fill="#FF5F57" />
    <circle cx="451" cy="404" r="13" fill="#FEBC2E" />
    <circle cx="488" cy="404" r="13" fill="#28C840" />
    <rect x="398" y="440" width="228" height="234" rx="30" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="422" y="468" width="120" height="18" rx="9" fill="#2F5FE0" fill-opacity="0.85" />
    <rect x="422" y="502" width="180" height="13" rx="6.5" fill="#2F5FE0" fill-opacity="0.35" />
    <rect x="422" y="527" width="150" height="13" rx="6.5" fill="#2F5FE0" fill-opacity="0.35" />
    <rect x="422" y="560" width="180" height="90" rx="16" fill="#2F5FE0" fill-opacity="0.18" />
    <rect x="372" y="360" width="280" height="340" rx="56" fill="none" stroke="url(#ring)" stroke-width="8" />

    <!-- search pill -->
    <rect x="352" y="250" width="320" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" />
    <circle cx="398" cy="279" r="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" />
    <line x1="408" y1="289" x2="420" y2="301" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" />
    <rect x="440" y="274" width="190" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.45" />
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" />
</svg>
