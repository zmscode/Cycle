<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cycle — "Orbit": a glass window circled by a two-arrow cycle, in Apple's sunset gradient. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F5A" />
      <stop offset="0.5" stop-color="#FF4F8B" />
      <stop offset="1" stop-color="#7B4BFF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.25" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE7F2" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5A1650" flood-opacity="0.4" />
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28" />
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185" /></clipPath>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGlow)" />

    <!-- cycle arrows: two arcs of a 270 radius circle, each ending in a head -->
    <g filter="url(#shadow)" fill="none" stroke="url(#arrow)" stroke-width="44" stroke-linecap="round">
      <path d="M 260 450 A 270 270 0 0 1 690 320" />
      <path d="M 764 574 A 270 270 0 0 1 334 704" />
    </g>
    <g filter="url(#shadow)" fill="url(#arrow)">
      <path d="M 742 280 L 640 357 L 740 390 Z" stroke="url(#arrow)" stroke-width="16" stroke-linejoin="round" />
      <path d="M 282 744 L 384 667 L 284 634 Z" stroke="url(#arrow)" stroke-width="16" stroke-linejoin="round" />
    </g>

    <!-- glass window in the middle -->
    <g filter="url(#shadow)">
      <rect x="352" y="392" width="320" height="240" rx="44" fill="url(#glass)" stroke="url(#rim)" stroke-width="5" />
      <circle cx="398" cy="432" r="12" fill="#FF5F57" />
      <circle cx="434" cy="432" r="12" fill="#FEBC2E" />
      <circle cx="470" cy="432" r="12" fill="#28C840" />
      <rect x="378" y="462" width="268" height="146" rx="22" fill="#FFFFFF" fill-opacity="0.55" />
    </g>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />
</svg>
